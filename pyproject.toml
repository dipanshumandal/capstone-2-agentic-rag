[tool.ruff]
line-length = 125
exclude = ["notebooks", "data", ".venv"]

[tool.ruff.lint]
# same kind of checks flake8 gave me in capstone 1 (errors, pyflakes, warnings)
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
